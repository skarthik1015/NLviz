# Free checks on every push and pull request: no secrets, no paid APIs, no deploy.
# Live Jammi tests skip without JAMMI_TEST_URL; Postgres tests skip without NLVIZ_TEST_DATABASE_URL.
# those run locally (live tests, evals) before a release.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # the backend image's Python
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          JAMMI_TEST_URL: ""
          NLVIZ_TEST_DATABASE_URL: ""
          NLVIZ_TEST_S3_ENDPOINT: ""
        run: python -m pytest -q --tb=short

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
